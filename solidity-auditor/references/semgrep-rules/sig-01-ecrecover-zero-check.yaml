rules:
  - id: sig-01-ecrecover-missing-zero-check
    patterns:
      - pattern-inside: |
          function $F(...) {
            ...
            $SIGNER = ecrecover(...);
            ...
          }
      - patterns:
          - pattern: |
              $SIGNER = ecrecover($HASH, $V, $R, $S)
          - pattern-not-inside: |
              function $F(...) {
                ...
                require($SIGNER != address(0), ...);
                ...
              }
          - pattern-not-inside: |
              function $F(...) {
                ...
                if ($SIGNER == address(0)) { ... revert(...); ... }
                ...
              }
          - pattern-not-inside: |
              function $F(...) {
                ...
                if ($SIGNER == address(0)) { ... return ...; ... }
                ...
              }
          - pattern-not-inside: |
              function $F(...) {
                ...
                return $SIGNER;
              }
          - pattern-not-inside: |
              function $F(...) {
                ...
                require($EXPECTED != address(0), ...);
                ...
                $SIGNER = ecrecover(...);
                ...
              }
    message: |
      SIG-01: Missing zero-address check on ecrecover() return value.

      Vulnerability: The function calls ecrecover() and uses the returned address without verifying it is not address(0).
      This allows invalid signatures to be accepted (all zeros hash to address(0)).

      Proof: Found ecrecover() call at line $LINENUM without safe guard.

      Safe patterns:
      - require(signer != address(0), "...")
      - if (signer == address(0)) revert()
      - if (signer == address(0)) return false
      - return signer; (caller responsibility)

      Fix: Add one of the above patterns.

      Reference: https://docs.openzeppelin.com/contracts/4.x/api/utils#ECDSA
    languages: [solidity]
    severity: HIGH
    confidence: MEDIUM

  - id: sig-01-ecrecover-zero-check-if-revert
    patterns:
      - pattern-inside: |
          function $F(...) {
            ...
            $SIGNER = ecrecover(...);
            ...
            if ($SIGNER == address(0)) { ... revert(...); ... }
            ...
          }
      - patterns:
          - pattern: $SIGNER = ecrecover($HASH, $V, $R, $S)
          - pattern-not-inside: |
              function $F(...) {
                ...
                require($SIGNER != address(0), ...);
                ...
              }
          - pattern-not-inside: |
              function $F(...) {
                ...
                require($EXPECTED != address(0), ...);
                ...
                $SIGNER = ecrecover(...);
                ...
              }
    message: |
      SIG-01: Missing zero-address guard on ecrecover() return.

      The function calls ecrecover() without guarding the return value against address(0).

      Safe patterns recognized:
      - require(signer != address(0), "...")
      - if (signer == address(0)) revert()
      - if (signer == address(0)) return (false/0/etc)
      - if (signer != address(0)) { ... } (positive guard)
      - return signer; (caller responsibility)

      Pattern found without recognized guard: $SIGNER = ecrecover(...)

      Fix: Add one of the safe patterns above.
    languages: [solidity]
    severity: HIGH
    confidence: MEDIUM

  - id: sig-01-ecrecover-implicit-zero-check
    patterns:
      - pattern-inside: |
          function $F(...) {
            ...
            $SIGNER = ecrecover(...);
            ...
            require($SIGNER == $EXPECTED, ...);
            ...
          }
      - pattern: $SIGNER = ecrecover($HASH, $V, $R, $S)
      - pattern-not-inside: |
          function $F(...) {
            ...
            require($SIGNER != address(0), ...);
            ...
          }
      - pattern-not-inside: |
          function $F(...) {
            ...
            require($EXPECTED != address(0), ...);
            ...
            $SIGNER = ecrecover(...);
            ...
          }
    message: |
      SIG-01: ecrecover() return compared to expected address without explicit zero-check.

      Vulnerability: The code requires signer == expected_address, but does NOT explicitly check signer != address(0).

      This is vulnerable because:
      - If ecrecover() returns address(0) (invalid signature), the require() will fail
      - BUT the attacker might control expected_address initialization (e.g., if it's msg.sender initially)
      - In rare cases, address(0) might be a valid signer in the protocol context (e.g., owner not yet set)

      Explicit guard recommended:
        require(signer != address(0), "Invalid signature");
        require(signer == expectedSigner, "Signature mismatch");

      Fix: Add explicit require(signer != address(0)) before require(signer == expected).
    languages: [solidity]
    severity: MEDIUM
    confidence: MEDIUM
