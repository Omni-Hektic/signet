# Legacy / Alias Domain 301 Redirect (signet.xyz -> signet.security)
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signet.xyz www.signet.xyz api.signet.xyz;

    ssl_certificate /etc/letsencrypt/live/signet.security/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signet.security/privkey.pem;

    return 301 https://signet.security$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name signet.security www.signet.security api.signet.security;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signet.security www.signet.security api.signet.security;

    ssl_certificate /etc/letsencrypt/live/signet.security/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signet.security/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static methodology page (Zero-404 Destination for Badge Clicks)
    location = /methodology {
        alias /var/www/signet/dist/methodology/index.html;
        default_type text/html;
        add_header Cache-Control "public, max-age=3600";
    }

    location /methodology/ {
        alias /var/www/signet/dist/methodology/;
        index index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # API Proxy (FastAPI Uvicorn Backend)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for /v1/feed/stream
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
